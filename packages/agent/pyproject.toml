[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "智能体装配、工具与推理运行时"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "agentscope>=2.0.10",
]

[tool.uv.sources]
agent-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]
