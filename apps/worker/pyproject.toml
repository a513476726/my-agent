[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-worker"
version = "0.1.0"
description = "定时任务与报告 worker"
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "agent-data",
    "agent-runtime",
    "apscheduler>=3.11",
    "httpx>=0.28",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-data = { workspace = true }
agent-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_worker"]
